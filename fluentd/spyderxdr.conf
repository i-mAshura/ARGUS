<source>
  @type windows_eventlog
  @id windows_events
  channels system,application
  tag spyderxdr.winevent
  <storage>
    @type local
    persistent true
    path C:\Users\Vishaal\Desktop\SpyderXDR-updated\fluentd\winevent_pos.json
  </storage>
</source>

<source>
  @type windows_eventlog
  @id sysmon_events
  channels Microsoft-Windows-Sysmon/Operational
  tag spyderxdr.sysmon
  <storage>
    @type local
    persistent true
    path C:\Users\Vishaal\Desktop\SpyderXDR-updated\fluentd\sysmon_pos.json
  </storage>
</source>

<source>
  @type exec
  tag spyderxdr.performance
  command powershell -NoProfile -Command "$cpu = [math]::Round(((Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter \"Name='_Total'\").PercentProcessorTime), 0); $os = Get-WmiObject Win32_OperatingSystem; $ram = [math]::Round(($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / $os.TotalVisibleMemorySize * 100, 2); $total_mb = [math]::Round($os.TotalVisibleMemorySize/1024,0); $free_mb = [math]::Round($os.FreePhysicalMemory/1024,0); Write-Output \"{`\"event_type`\":`\"cpu_ram_performance`\",`\"cpu_percent`\":$cpu,`\"ram_percent`\":$ram,`\"total_ram_mb`\":$total_mb,`\"free_ram_mb`\":$free_mb}\""
  run_interval 30s
  <parse>
    @type json
  </parse>
</source>

<source>
  @type exec
  tag spyderxdr.network
  command powershell -NoProfile -Command "Get-NetTCPConnection -State Established | Select-Object -First 10 | ForEach-Object { Write-Output \"{`\"event_type`\":`\"network_connection`\",`\"local_address`\":`\"$($_.LocalAddress)`\",`\"local_port`\":$($_.LocalPort),`\"remote_address`\":`\"$($_.RemoteAddress)`\",`\"remote_port`\":$($_.RemotePort),`\"state`\":`\"$($_.State)`\"}\" }"
  run_interval 60s
  parallel true
  <parse>
    @type json
  </parse>
</source>

<source>
  @type exec
  tag spyderxdr.process
  command powershell -NoProfile -Command "Get-Process | Sort-Object CPU -Descending | Select-Object -First 10 | ForEach-Object { $mem = [math]::Round($_.WorkingSet/1MB,2); $cpu = if($_.CPU){[math]::Round($_.CPU,2)}else{0}; Write-Output \"{`\"event_type`\":`\"process_creation`\",`\"process_name`\":`\"$($_.Name)`\",`\"pid`\":$($_.Id),`\"cpu`\":$cpu,`\"memory_mb`\":$mem}\" }"
  run_interval 120s
  parallel true
  <parse>
    @type json
  </parse>
</source>

<source>
  @type tail
  @id agent_metrics
  path C:\SpyderXDR\logs\metrics.log
  tag spyderxdr.agent
  <parse>
    @type json
  </parse>
  <storage>
    @type local
    persistent true
    path C:\Users\Vishaal\Desktop\SpyderXDR-updated\fluentd\agent_pos.json
  </storage>
</source>

<filter spyderxdr.**>
  @type record_transformer
  enable_ruby true
  <record>
    hostname "#{Socket.gethostname}"
    agent_id "fluentd-windows-agent"
    source_ip "127.0.0.1"
    destination_ip ""
    timestamp "${time.strftime('%Y-%m-%dT%H:%M:%S%z')}"
    fluentd_tag "${tag}"
  </record>
</filter>

<filter spyderxdr.winevent>
  @type record_transformer
  enable_ruby true
  <record>
    event_type "winevent"
  </record>
</filter>

<filter spyderxdr.sysmon>
  @type record_transformer
  enable_ruby true
  <record>
    event_type "sysmon"
    source "sysmon"
  </record>
</filter>

<match spyderxdr.**>
  @type kafka
  brokers localhost:9092
  default_topic spyderxdr.telemetry
  output_data_type json
  required_acks 1
  compression_codec gzip
</match>