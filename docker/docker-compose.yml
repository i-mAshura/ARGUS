version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: spyderxdr-postgres
    environment:
      POSTGRES_DB: spyderxdr
      POSTGRES_USER: xdr_user
      POSTGRES_PASSWORD: xdr_pass
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - xdr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdr_user -d spyderxdr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spyderxdr-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass xdr_redis_pass
    volumes:
      - redis_data:/data
    networks:
      - xdr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for log aggregation
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: spyderxdr-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - xdr_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: spyderxdr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - xdr_network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: spyderxdr-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Internal listener for container-to-container communication;
      # external listener for host access (localhost:9092).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - xdr_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: spyderxdr-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://xdr_user:xdr_pass@postgres:5432/spyderxdr
      REDIS_URL: redis://:xdr_redis_pass@redis:6379
      ELASTICSEARCH_HOST: elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ../backend/app:/app/app
      - ../backend/api_client.yaml:/app/api_client.yaml
      - ../backend/kafka_consumer.py:/app/kafka_consumer.py
    networks:
      - xdr_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Kafka Consumer for Threat Detection Engine
  kafka-consumer:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: spyderxdr-kafka-consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://xdr_user:xdr_pass@postgres:5432/spyderxdr
      REDIS_URL: redis://:xdr_redis_pass@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKER: kafka:29092
      ELASTICSEARCH_HOST: elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ../backend/app:/app/app
      - ../backend/api_client.yaml:/app/api_client.yaml
      - ../backend/kafka_consumer.py:/app/kafka_consumer.py
    networks:
      - xdr_network
    command: python kafka_consumer.py

  # React Dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: spyderxdr-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8001/api/v1
    depends_on:
      - backend
    networks:
      - xdr_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: spyderxdr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - xdr_network

networks:
  xdr_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  kafka_data:
  prometheus_data:
